name: Validate procurement model
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  run-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m py_compile scripts/optimization_model.py
      - run: python scripts/optimization_model.py
      - run: test -s dashboards/supplier_scorecard.csv && test -s dashboards/computed_supplier_recommendations.csv
